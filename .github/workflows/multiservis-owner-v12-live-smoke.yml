name: Multi-Servis OWNER V12 — public read-only postdeploy smoke
on:
  push:
    branches: [multiservis-panel-multiguard-gold-crimson-v1]
    paths:
      - 'embedded-multiguard/deploy/owner-v12-livecheck.trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify V12 routes and unaffected Android-facing API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://api.multi-servis.pl/health >/dev/null
          curl --fail --silent --show-error --max-time 30 https://api.multi-servis.pl/openapi.json -o /tmp/openapi-owner.json
          python3 - <<'PY'
          import json
          with open('/tmp/openapi-owner.json',encoding='utf-8-sig') as f:
              paths=json.load(f).get('paths',{})
          expected=[
            '/multiguard/panel/dashboard',
            '/multiguard/panel/service',
            '/multiguard/panel/service/{order_id}',
            '/multiguard/panel/service/{order_id}/media/{media_id}',
            '/multiguard/panel/settings',
            '/multiguard/panel/device/{installation_id}/note',
            '/multiguard/panel/device/{installation_id}/diagnostic-plan',
            '/multiguard/panel/incident/{event_id}',
            '/multiguard/panel/versions',
            '/multiguard/agent/heartbeat',
            '/multiguard/agent/event',
          ]
          missing=[p for p in expected if p not in paths]
          if missing: raise SystemExit('FAIL: missing public route definitions: '+', '.join(missing))
          print(f'PASS: health OK, {len(expected)} protected and agent endpoints in production API')
          PY
      - name: Ensure owner browser pages require login (no credentials used)
        run: |
          set -euo pipefail
          for path in /multiguard/panel/dashboard /multiguard/panel/service /multiguard/panel/versions /multiguard/panel/settings; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://api.multi-servis.pl$path")"
            printf 'Owner route %s => HTTP %s\n' "$path" "$status"
            test "$status" = 401 || { echo 'FAIL: Expected HTTP 401 from private panel route'; exit 1; }
          done
          echo "PASS: all sampled owner browser pages reject anonymous requests"
