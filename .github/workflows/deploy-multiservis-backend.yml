name: Deploy Multi-Servis Backend

on:
  push:
    branches: [main]
    paths:
      - "embedded-multiguard/**"
      - ".github/workflows/deploy-multiservis-backend.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Wpisz DEPLOY, aby wdrożyć backend na serwer produkcyjny"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: multiservis-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Validate deployment package
        shell: bash
        run: |
          set -euo pipefail
          bash -n embedded-multiguard/install.sh
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_license.py
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_runtime.py
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_remote.py
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_meshcentral.py
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_updates.py
          python3 -m py_compile embedded-multiguard/scripts/sync_multiguard_releases.py

      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.MULTISERVIS_BACKEND_HOST }}
          SSH_PORT: ${{ secrets.MULTISERVIS_BACKEND_PORT }}
          SSH_USER: ${{ secrets.MULTISERVIS_BACKEND_USER }}
          SSH_KEY: ${{ secrets.MULTISERVIS_BACKEND_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Brak secret MULTISERVIS_BACKEND_HOST}"
          : "${SSH_USER:?Brak secret MULTISERVIS_BACKEND_USER}"
          : "${SSH_KEY:?Brak secret MULTISERVIS_BACKEND_SSH_KEY}"
          SSH_PORT="${SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/multiservis_backend
          chmod 600 ~/.ssh/multiservis_backend
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend through SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.MULTISERVIS_BACKEND_HOST }}
          SSH_PORT: ${{ secrets.MULTISERVIS_BACKEND_PORT }}
          SSH_USER: ${{ secrets.MULTISERVIS_BACKEND_USER }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          REMOTE_REF="$GITHUB_SHA"

          ssh \
            -i ~/.ssh/multiservis_backend \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "if [ \$(id -u) -eq 0 ]; then env MULTISERVIS_BACKEND_REF='$REMOTE_REF' bash -s; else sudo -n env MULTISERVIS_BACKEND_REF='$REMOTE_REF' bash -s; fi" \
            < embedded-multiguard/install.sh

      - name: Verify production API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://api.multi-servis.pl/openapi.json -o /tmp/openapi.json

          python3 - <<'PY'
          import json

          with open('/tmp/openapi.json', 'r', encoding='utf-8-sig') as handle:
              data = json.load(handle)

          paths = data.get('paths', {})
          required = [
              '/multiguard/licenses/receptions/{reception_id}',
              '/multiguard/licenses/receptions/{reception_id}/generate',
              '/multiguard/licenses/receptions/{reception_id}/release-channel',
              '/v1/multi-guard/discovery/register',
              '/v1/multi-guard/discovery/assignment',
              '/multiguard/pending-installations',
              '/multiguard/pending-installations/{installation_id}/assign',
              '/multiguard/overview',
              '/multiguard/notifications',
              '/multiguard/support-requests',
              '/multiguard/agent/heartbeat',
              '/multiguard/agent/event',
              '/multiguard/events/{event_id}',
              '/multiguard/devices',
              '/multiguard/devices/{installation_id}/events',
              '/multiguard/telemetry',
              '/multiguard/panel/dashboard',
              '/multiguard/panel/telemetry',
              '/multiguard/panel/telemetry/detail',
              '/multiguard/panel/licenses',
              '/multiguard/agent/remote/poll',
              '/multiguard/agent/remote/decision',
              '/multiguard/agent/remote/end',
              '/multiguard/remote-sessions',
              '/multiguard/remote-sessions/{session_id}',
              '/multiguard/remote-sessions/{session_id}/connect',
              '/multiguard/remote-sessions/{session_id}/end',
              '/multiguard/remote/mesh-bind',
              '/multiguard/releases/{target}/{arch}/{current_version}',
              '/multiguard/update-assets/{channel}/{version}/{filename}',
          ]
          missing = [path for path in required if path not in paths]
          if missing:
              raise SystemExit('Brak tras produkcyjnych: ' + ', '.join(missing))

          props = (
              data.get('components', {})
              .get('schemas', {})
              .get('GenerateLicenseRequest', {})
              .get('properties', {})
          )
          if 'releaseChannel' not in props:
              raise SystemExit('Produkcja nie publikuje releaseChannel w GenerateLicenseRequest.')

          print('OK: produkcyjny backend Multi-Guard jest kompletny.')
          PY

          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -H 'X-Multi-Guard-Installation: 00000000-0000-4000-8000-000000000029' \
            https://api.multi-servis.pl/multiguard/releases/windows/x86_64/0.3.29 \
            -o /tmp/multiguard-update.json

          python3 - <<'PY'
          import json
          with open('/tmp/multiguard-update.json', 'r', encoding='utf-8-sig') as handle:
              payload = json.load(handle)
          version = tuple(int(part) for part in payload['version'].split('.'))
          if version <= (0, 3, 29):
              raise SystemExit('Updater nie oferuje wersji nowszej niż 0.3.29.')
          if not payload.get('url', '').startswith('https://api.multi-servis.pl/multiguard/update-assets/'):
              raise SystemExit('Updater nie serwuje artefaktu przez api.multi-servis.pl.')
          if len(payload.get('sha256', '')) != 64 or not payload.get('signature'):
              raise SystemExit('Updater nie zwraca pełnych danych podpisanego artefaktu.')
          print('OK: 0.3.29 widzi aktualizację przez produkcyjny przycisk updatera.')
          PY
