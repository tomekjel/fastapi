name: OWNER remote licence-mode security regression (draft, no deployment)
on:
  push:
    branches:
      - fix/owner-pro-remote-first-consent-20261018
    paths:
      - embedded-multiguard/app/routers/multiguard_remote_policy.py
      - embedded-multiguard/app/routers/multiguard_workshop_remote.py
      - embedded-multiguard/app/routers/multiguard_remote.py
      - embedded-multiguard/tests/test_remote_consent_policy.py
      - embedded-multiguard/tests/test_session_transport_enrollment.py
      - .github/workflows/owner-remote-security-draft-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python modules compile (no server access)
        run: |
          python3 -m compileall -q embedded-multiguard/app/routers/multiguard_remote_policy.py embedded-multiguard/app/routers/multiguard_workshop_remote.py embedded-multiguard/app/routers/multiguard_remote.py
      - name: Pure authorization matrix (no deps, no server)
        run: |
          python3 -m unittest discover -s embedded-multiguard/tests -p 'test_remote_consent_policy.py' -v
      - name: Mocked FastAPI, MeshCtrl and licence-mode routing regressions
        run: |
          python3 -m pip install -q --disable-pip-version-check 'fastapi>=0.110,<1' 'sqlalchemy>=2,<3' 'httpx>=0.27,<1' 'python-multipart>=0.0.12,<1'
          python3 -m unittest discover -s embedded-multiguard/tests -p 'test_session_transport_enrollment.py' -v
      - name: End of offline-only test
        run: echo 'No production, database, MeshCentral or client computer touched.'
