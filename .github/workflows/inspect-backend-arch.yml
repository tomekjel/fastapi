name: Inspect backend architecture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-backend-arch.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect selected backend sources
        shell: bash
        run: |
          set -e
          rm -rf /tmp/msbackend
          mkdir -p /tmp/msbackend
          unzip -q MultiServisServer_FINAL.zip -d /tmp/msbackend
          echo "=== FILES ==="
          find /tmp/msbackend -maxdepth 4 -type f | sed 's#^/tmp/msbackend/##' | sort | head -300
          echo "=== SAFE SOURCES ==="
          find /tmp/msbackend -type f \( -name 'main.py' -o -name 'database.py' -o -name 'db.py' -o -name 'security.py' -o -name 'requirements.txt' -o -name 'models.py' -o -name 'schemas.py' \) | while read f; do
            echo "--- ${f#/tmp/msbackend/} ---"
            sed -n '1,260p' "$f"
          done
          echo "=== ROUTER HEADERS ==="
          find /tmp/msbackend -type f -path '*/routers/*.py' | sort | while read f; do
            echo "--- ${f#/tmp/msbackend/} ---"
            grep -nE '^(router|@router\.|class |def |async def |from app|import )' "$f" | head -220 || true
          done
