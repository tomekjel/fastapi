name: Verify Android 1.6 publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-android-1-6.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for server pull updater
        run: sleep 135
      - name: Verify live manifest
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://api.multi-servis.pl/app-updates/android/latest.json)"
          echo "$JSON"
          echo "$JSON" | grep -q '"version_code":7'
          echo "$JSON" | grep -q '"version_name":"1.6"'
