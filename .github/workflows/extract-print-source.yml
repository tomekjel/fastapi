name: Extract backend source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-print-source.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract backend source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .inspection
          mkdir -p .inspection/full
          tmp="$(mktemp -d)"
          unzip -q MultiServisServer_FINAL.zip -d "$tmp"
          while IFS= read -r -d "" f; do
            rel="${f#$tmp/}"
            case "$f" in
              *.py|*.sql|*.sh|*.service|*.txt|*.md|*.json|*.yaml|*.yml|*.toml)
                mkdir -p ".inspection/full/$(dirname "$rel")"
                cp "$f" ".inspection/full/$rel"
                ;;
            esac
          done < <(find "$tmp" -type f -print0)
          find .inspection -type f -print | sort > .inspection/files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .inspection
          git commit -m "chore: expose backend source for inspection"
          git push