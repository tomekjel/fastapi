name: OWNER V12 CT103 read-only preflight
on:
  push:
    branches: [fix/owner-pro-remote-first-consent-20261018]
    paths: ['embedded-multiguard/deploy/owner-remote-servercheck.trigger']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    environment: production
    defaults:
      run:
        shell: cmd
    env:
      SSH_HOST: ${{ secrets.MULTISERVIS_BACKEND_HOST }}
      SSH_PORT: ${{ secrets.MULTISERVIS_BACKEND_PORT }}
      SSH_USER: ${{ secrets.MULTISERVIS_BACKEND_USER }}
      SSH_KEY: ${{ secrets.MULTISERVIS_BACKEND_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false
      - name: Read-only MeshCentral group isolation preflight
        run: |
          @echo off
          if /I not "%RUNNER_NAME%"=="ROG" exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File embedded-multiguard\scripts\owner_mesh_groups_readonly.ps1
          if errorlevel 1 exit /b 1
      - name: Read-only CT103 readiness probe
        run: |
          @echo off
          if /I not "%RUNNER_NAME%"=="ROG" exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File embedded-multiguard\scripts\owner_remote_servercheck.ps1
          if errorlevel 1 exit /b 1
