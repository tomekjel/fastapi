name: Multi-Guard OWNER licence regression (private Windows)
on:
  push:
    branches: [feature/service-mode-monitoring-20261010]
    paths:
      - '.github/workflows/owner-license-regression.yml'
      - 'tests/test_multiguard_direct_assignment_atomicity.py'
      - 'embedded-multiguard/app/routers/multiguard_license.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-license-tests:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - name: Verify OWNER computer
        run: |
          @echo off
          if /I not "%RUNNER_NAME%"=="ROG" (echo ERROR: Unexpected backend runner %RUNNER_NAME% & exit /b 1)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false
      - name: Run synthetic licence regression suite
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          set "PYTHONPATH=%GITHUB_WORKSPACE%\embedded-multiguard"
          where python >nul 2>nul
          if not errorlevel 1 (
            python -m unittest discover -s tests -p test_multiguard_direct_assignment_atomicity.py -v
            exit /b !ERRORLEVEL!
          )
          where py >nul 2>nul
          if not errorlevel 1 (
            py -3 -m unittest discover -s tests -p test_multiguard_direct_assignment_atomicity.py -v
            exit /b !ERRORLEVEL!
          )
          echo ERROR: Python not available on ROG
          exit /b 1
