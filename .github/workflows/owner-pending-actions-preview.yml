name: OWNER safe pending actions pre-merge

on:
  push:
    branches: [feature/owner-safe-pending-actions-20261010]
    paths:
      - embedded-multiguard/app/routers/multiguard_runtime.py
      - embedded-multiguard/app/routers/multiguard_panel_theme.py
      - embedded-multiguard/tests/test_owner_pending_actions_safety.py
      - .github/workflows/owner-pending-actions-preview.yml
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python router syntax
        run: python3 -m py_compile embedded-multiguard/app/routers/multiguard_runtime.py
      - name: Verify protected OWNER actions and layout
        run: python3 embedded-multiguard/tests/test_owner_pending_actions_safety.py
      - name: Existing OWNER security checks
        run: python3 embedded-multiguard/tests/test_owner_panel_security.py
