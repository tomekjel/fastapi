name: Multi-Servis OWNER pending clean-up — pre-deploy verification

on:
  push:
    branches: [feature/owner-pending-cleanup-web-20261010]
    paths:
      - embedded-multiguard/app/routers/multiguard_license.py
      - embedded-multiguard/app/routers/multiguard_runtime.py
      - embedded-multiguard/deploy-owner-web-v12.sh
      - .github/workflows/owner-pending-cleanup-verify.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python compilation without database connections
        run: |
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_license.py embedded-multiguard/app/routers/multiguard_runtime.py
          bash -n embedded-multiguard/deploy-owner-web-v12.sh
      - name: Existing OWNER security tests
        run: python3 embedded-multiguard/tests/test_owner_panel_security.py
      - name: Verify web-only archive route and no data erasure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("embedded-multiguard/app/routers")
          runtime=(root/"multiguard_runtime.py").read_text(encoding="utf8")
          license=(root/"multiguard_license.py").read_text(encoding="utf8")
          assert 'def owner_archive_pending_installation(' in runtime
          assert 'WHERE installation_id=:iid FOR UPDATE' in runtime
          assert 'status=\'ARCHIVED\'' in runtime
          assert 'guard.pending_archive_events' in license
          assert 'THEN \'WAITING\' ELSE status END' in license
          assert 'DELETE FROM guard.pending_installations' not in runtime
          print("PASS: owner archive only; no destructive deletes; reconnect recovery.")
          PY
