name: Inspect call API source

on:
  push:
    branches:
      - inspect-call-api-source
    paths:
      - ".github/workflows/inspect-call-api-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract relevant call endpoints
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ms
          mkdir -p /tmp/ms
          unzip -q MultiServisServer_FINAL.zip -d /tmp/ms
          ROOT="/tmp/ms/MultiServisServer_FINAL"
          python3 - <<'PY'
          from pathlib import Path

          root=Path("/tmp/ms/MultiServisServer_FINAL")
          needles=[
              '/calls/import-recording',
              '/calls/recordings',
              '/calls/match/',
              '/calls/upload-policy/',
          ]
          for path in root.rglob("*.py"):
              text=path.read_text(encoding="utf-8", errors="replace")
              for needle in needles:
                  pos=text.find(needle)
                  if pos >= 0:
                      print("\n### FILE", path.relative_to(root), "NEEDLE", needle)
                      start=max(0, text.rfind("\n",0,max(0,pos-5000)))
                      end=min(len(text), text.find("\n\n@", pos+1) if text.find("\n\n@", pos+1)>=0 else pos+7000)
                      print(text[start:end])
          PY
