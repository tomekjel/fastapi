name: Inspect call API source

on:
  push:
    branches:
      - inspect-call-api-source
    paths:
      - ".github/workflows/inspect-call-api-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact call endpoints
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ms
          mkdir -p /tmp/ms
          unzip -q MultiServisServer_FINAL.zip -d /tmp/ms
          FILE="/tmp/ms/MultiServisServer_FINAL/app/routers/calls.py"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/ms/MultiServisServer_FINAL/app/routers/calls.py")
          lines=p.read_text(encoding="utf-8", errors="replace").splitlines()
          needles=['@router.post("/import-recording")','@router.get("/recordings")','@router.get("/recordings/{recording_id}/content")','@router.get("/match/{phone}")','@router.get("/upload-policy/{phone}")']
          for needle in needles:
              print("\n===== ",needle," =====")
              for i,line in enumerate(lines):
                  if needle in line:
                      a=max(0,i-8); b=min(len(lines),i+110)
                      for n in range(a,b):
                          print(f"{n+1:04d}: {lines[n]}")
                      break
          PY
