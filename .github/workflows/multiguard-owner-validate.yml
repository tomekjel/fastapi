name: Multi-Guard Owner Integration Validate

on:
  push:
    branches:
      - work-multiservis-multiguard-owner
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m py_compile embedded-multiguard/app/routers/multiguard_license.py
          python -m py_compile embedded-multiguard/app/routers/multiguard_runtime.py

      - name: Installer syntax
        run: bash -n embedded-multiguard/install.sh
