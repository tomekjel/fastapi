name: OWNER KeyGate DIRECT regression no deploy
on:
  push:
    branches: [fix/owner-keygate-direct-reconcile-20261029]
    paths:
      - embedded-multiguard/app/routers/multiguard_runtime.py
      - embedded-multiguard/scripts/inspect_test_installation.py
      - embedded-multiguard/app/routers/multiguard_license.py
      - .github/workflows/owner-keygate-direct-regression.yml
  pull_request:
    paths:
      - embedded-multiguard/app/routers/multiguard_license.py
      - embedded-multiguard/app/routers/multiguard_remote.py
      - embedded-multiguard/app/routers/multiguard_runtime.py
      - embedded-multiguard/scripts/deploy_pr30_two_modules.sh
      - embedded-multiguard/tests/test_owner_panel_postgres_integration.py
      - embedded-multiguard/tests/test_revoke_source_regression.py
      - .github/workflows/owner-keygate-direct-regression.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile changed Python files without importing production services
        run: |
          python -m py_compile embedded-multiguard/app/routers/multiguard_license.py
          python -m py_compile embedded-multiguard/app/routers/multiguard_remote.py
          python -m py_compile embedded-multiguard/app/routers/multiguard_runtime.py
          python -m py_compile embedded-multiguard/scripts/inspect_test_installation.py
          bash -n embedded-multiguard/scripts/deploy_pr30_two_modules.sh
          python -m py_compile embedded-multiguard/tests/test_owner_panel_postgres_integration.py
          python embedded-multiguard/tests/test_revoke_source_regression.py
      - name: Check required duplicate-safety regression assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'assert mock_calls["create"]==1' embedded-multiguard/tests/test_owner_panel_postgres_integration.py
          grep -Fq 'RECONCILIATION_REQUIRED" in conflict.text' embedded-multiguard/tests/test_owner_panel_postgres_integration.py
          grep -Fq 'return _normalize_link(dict(existing))' embedded-multiguard/app/routers/multiguard_license.py

  postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: multiservis_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d multiservis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      OWNER_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only@127.0.0.1:5432/multiservis_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test-only stack
        run: python -m pip install --quiet 'fastapi>=0.115,<1.0' 'SQLAlchemy>=2,<3' 'psycopg[binary]>=3,<4' 'python-multipart>=0.0.19' 'httpx>=0.27,<1' 'cryptography>=42'
      - name: Test real FastAPI with isolated PostgreSQL and mocked KeyGate
        run: python embedded-multiguard/tests/test_owner_panel_postgres_integration.py
