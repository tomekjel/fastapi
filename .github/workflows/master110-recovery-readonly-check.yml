name: MASTER110 OWNER recovery integration contract
on:
  push:
    branches: [mg/master110-recovery-preview-20261115]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test durable KeyGate activation attempt journal
        run: python -m unittest scripts/tests/test_master110_durable_journal.py -v
      - name: Test KeyGate compensation after failed PostgreSQL write
        run: python -m unittest scripts/tests/test_master110_keygate_compensation.py -v
      - name: Test atomic license binding competing installs
        run: python -m unittest scripts/tests/test_master110_provision_binding_cas.py -v
      - name: Test OWNER approval with transactional fake database
        run: python -m unittest scripts/tests/test_master110_owner_approval_transaction.py -v
      - name: Execute provision recovery guards against actual backend code
        run: python -m unittest scripts/tests/test_master110_recovery_provision_guard.py -v
      - name: Compile backend and guard recovery preview contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("embedded-multiguard/app/routers/multiguard_license.py")
          content=p.read_text(encoding="utf-8")
          module=ast.parse(content)
          function=next(n for n in module.body if isinstance(n,ast.FunctionDef) and n.name=="owner_recovery_preview")
          body=ast.get_source_segment(content,function)
          assert 'Depends(require_owner)' in body
          assert 'requiresOwnerApproval' in body and 'automaticallyAuthorized' in body
          assert 'mutated' in body
          assert not any(x in body for x in ['_keygate_deactivate(', '_keygate_activate(', 'connection.execute(text("UPDATE', 'DELETE FROM', 'UPDATE guard.', 'mesh_ctrl'])
          print("PASS: PYTHON_PARSE")
          print("PASS: OWNER_AUTHENTICATED_READONLY_RECOVERY")
          print("PASS: NO_LICENSE_OR_MESH_MUTATION")
          approval=next(n for n in module.body if isinstance(n,ast.FunctionDef) and n.name=="approve_pending_recovery")
          approval_body=ast.get_source_segment(content,approval)
          assert 'Depends(require_owner)' in approval_body
          assert 'status=\'ASSIGNED\'' in approval_body
          assert 'FOR UPDATE' in approval_body
          assert 'rebind_pending' in approval_body
          assert 'expected_license_id' in approval_body
          assert 'valid_until' in approval_body
          assert 'last_seen_at' in approval_body
          assert 'total_seconds() > 300' in approval_body
          assert 'guard.installations' in approval_body
          assert 'is_current=TRUE' in approval_body
          assert "'pendingClientProvision': True" not in approval_body or 'pendingClientProvision' in approval_body
          assert not any(term in approval_body for term in ['_keygate_activate(', '_keygate_deactivate(', 'mesh_ctrl', '_generate_license_link(', 'UPDATE guard.license_links'])
          print("PASS: EXPLICIT_OWNER_RECOVERY_APPROVAL_REUSES_EXISTING_LICENSE")
          print("PASS: RECOVERY_NO_NEW_LICENSE_NO_MESH_CHANGE")
          register=next(n for n in module.body if isinstance(n,ast.FunctionDef) and n.name=="discovery_register")
          register_body=ast.get_source_segment(content, register)
          assert 'RECOVERY_REQUIRED:' in register_body
          assert 'serial_number' in register_body
          assert 'manufacturer' in register_body
          assert 'stored and received and stored != received' in register_body
          assert 'hostname' not in register_body.split('# MASTER110:')[1].split('row = connection.execute(')[0].split('for field')[1]
          print("PASS: DUPLICATED_INSTALLATION_CANNOT_OVERWRITE_HARDWARE_RECORD")
          provision=next(n for n in module.body if isinstance(n,ast.FunctionDef) and n.name=="provision")
          provision_body=ast.get_source_segment(content,provision)
          assert 'if link.get("rebind_pending"):' in provision_body
          assert 'discovery_secret = (req.discovery_credential or "").strip()' in provision_body
          assert '"discovery_credential_sha256"' in provision_body
          assert '_hash(discovery_secret)' in provision_body
          assert provision_body.index('discovery_secret = ') < provision_body.index('activated = _keygate_activate(')
          assert 'default=None, alias="discoveryCredential"' in content
          print("PASS: RECOVERY_REQUIRES_NEW_INSTALLATION_DISCOVERY_CREDENTIAL")
          assert 'pending.get("status") != "ASSIGNED"' in provision_body
          assert 'pending.get("assigned_reception_id") != link["reception_id"]' in provision_body
          assert 'secrets.compare_digest(str(pending.get("device_id") or ""), req.device_id)' in provision_body
          assert '(_utcnow() - pending["last_seen_at"]).total_seconds() > 300' in provision_body
          assert provision_body.index('if link.get("rebind_pending"):') < provision_body.index('activated = _keygate_activate(')
          assert 'lifecycle = (' in provision_body and 'if link.get("rebind_pending")' in provision_body
          assert 'valid_until=:valid_until' not in provision_body
          print("PASS: OWNER_APPROVAL_REQUIRED_BEFORE_RECOVERED_KEYGATE_ACTIVATION")
          print("PASS: RECOVERY_PRESERVES_PAID_VALID_UNTIL")
          tx = next(n for n in ast.walk(provision) if isinstance(n, ast.With)
                    and any(isinstance(i.context_expr,ast.Call)
                            and isinstance(i.context_expr.func,ast.Attribute)
                            and i.context_expr.func.attr == "begin" for i in n.items))
          tx_source=ast.get_source_segment(content,tx)
          assert 'SELECT * FROM guard.license_links WHERE id=:id FOR UPDATE' in tx_source
          assert 'SELECT * FROM guard.pending_installations' in tx_source
          assert tx_source.index('SELECT * FROM guard.pending_installations') < tx_source.index('SELECT * FROM guard.license_links WHERE id=:id FOR UPDATE')
          assert tx_source.index('SELECT * FROM guard.license_links WHERE id=:id FOR UPDATE') < tx_source.index('activated = _keygate_activate(')
          assert tx_source.index('activated = _keygate_activate(') < tx_source.index('UPDATE guard.license_links')
          assert 'RECOVERY_REQUIRED: Zatwierdzenie OWNER wygasło lub zmieniło się.' in tx_source
          print("PASS: KEYGATE_ACTIVATION_SERIALIZED_AFTER_DB_LICENSE_ROW_LOCK")
          print("PASS: CONSISTENT_PENDING_THEN_LICENSE_LOCK_ORDER")
          journal=next(n for n in module.body if isinstance(n,ast.FunctionDef)
                       and n.name=="_begin_keygate_provision_attempt")
          finish=next(n for n in module.body if isinstance(n,ast.FunctionDef)
                      and n.name=="_finish_keygate_provision_attempt")
          listing=next(n for n in module.body if isinstance(n,ast.FunctionDef)
                       and n.name=="owner_keygate_reconciliation")
          listing_src=ast.get_source_segment(content,listing)
          assert 'Depends(require_owner)' in listing_src
          assert '"automaticallyRetried": False' in listing_src
          assert "state IN ('INTENT','NEEDS_REVIEW')" in listing_src
          assert 'UPDATE guard.' not in listing_src
          assert 'CREATE UNIQUE INDEX IF NOT EXISTS idx_guard_keygate_provision_unresolved' in content
          provision_src=ast.get_source_segment(content,provision)
          assert provision_src.index('_begin_keygate_provision_attempt(') < provision_src.index('_keygate_activate(')
          assert '_finish_keygate_provision_attempt(attempt_id, committed=False)' in provision_src
          assert '_finish_keygate_provision_attempt(attempt_id, committed=True)' in provision_src
          assert "WHERE id=:id AND state='INTENT'" in ast.get_source_segment(content,finish)
          print("PASS: DURABLE_KEYGATE_INTENT_AND_OWNER_RECONCILIATION")


          PY
