name: Diagnose call recordings fixed

on:
  push:
    branches:
      - diag-call-recordings-20261005
    paths:
      - ".github/workflows/diag-call-recordings-fixed.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.MULTISERVIS_BACKEND_HOST }}
          SSH_PORT: ${{ secrets.MULTISERVIS_BACKEND_PORT }}
          SSH_USER: ${{ secrets.MULTISERVIS_BACKEND_USER }}
          SSH_KEY: ${{ secrets.MULTISERVIS_BACKEND_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?missing-host}"
          : "${SSH_USER:?missing-user}"
          : "${SSH_KEY:?missing-key}"
          SSH_PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only diagnosis
        shell: bash
        env:
          SSH_HOST: ${{ secrets.MULTISERVIS_BACKEND_HOST }}
          SSH_PORT: ${{ secrets.MULTISERVIS_BACKEND_PORT }}
          SSH_USER: ${{ secrets.MULTISERVIS_BACKEND_USER }}
          REMOTE_SCRIPT_B64: ""
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          printf '%s' "$REMOTE_SCRIPT_B64" | base64 -d | ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "if [ \$(id -u) -eq 0 ]; then bash -s; else sudo -n bash -s; fi"
