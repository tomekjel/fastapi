name: Diagnose call recording backend shape

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-call-recordings.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Query anonymized call state
        id: query
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.MULTISERVIS_BACKEND_HOST }}
          SSH_PORT: ${{ secrets.MULTISERVIS_BACKEND_PORT }}
          SSH_USER: ${{ secrets.MULTISERVIS_BACKEND_USER }}
          SSH_KEY: ${{ secrets.MULTISERVIS_BACKEND_SSH_KEY }}
        run: |
          set -uo pipefail
          RESULT=diag-call-recordings-result.txt

          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            printf '%s\n' '{"status":"missing_repo_secrets"}' > "$RESULT"
            exit 0
          fi

          SSH_PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/multiservis_backend
          chmod 600 ~/.ssh/multiservis_backend

          if ! ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            printf '%s\n' '{"status":"ssh_keyscan_failed"}' > "$RESULT"
            exit 0
          fi
          chmod 600 ~/.ssh/known_hosts

          if ! ssh -i ~/.ssh/multiservis_backend -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /opt/multiservis && .venv/bin/python -' > "$RESULT.tmp" <<'PY'
          import json
          from sqlalchemy import text
          from app.database import engine

          sql = text("""
          SELECT
            to_char(c.started_at AT TIME ZONE 'Europe/Warsaw', 'YYYY-MM-DD HH24:MI:SS') AS local_started,
            c.direction::text AS direction,
            c.duration_seconds,
            (c.service_order_id IS NOT NULL) AS attached_to_reception,
            COALESCE(so_status.status::text, '') AS reception_status,
            COUNT(cr.id)::int AS recording_count,
            COALESCE(bool_or(so.upload_completed), FALSE) AS upload_completed,
            COALESCE(max(so.size_bytes), 0)::bigint AS max_size_bytes
          FROM core.calls c
          JOIN core.phone_numbers p ON p.id = c.phone_number_id
          LEFT JOIN core.call_recordings cr ON cr.call_id = c.id
          LEFT JOIN core.storage_objects so ON so.id = cr.storage_object_id
          LEFT JOIN service.service_orders so_status ON so_status.id = c.service_order_id
          WHERE (c.started_at AT TIME ZONE 'Europe/Warsaw') >= TIMESTAMP '2026-10-05 10:15:00'
            AND (c.started_at AT TIME ZONE 'Europe/Warsaw') <  TIMESTAMP '2026-10-05 10:35:00'
            AND right(regexp_replace(COALESCE(p.e164,p.display_number,''), '[^0-9]', '', 'g'), 3) = '205'
          GROUP BY c.id, local_started, c.direction, c.duration_seconds, c.service_order_id, so_status.status
          ORDER BY local_started
          """)

          with engine.connect() as con:
              rows = [dict(r) for r in con.execute(sql).mappings().all()]

          print(json.dumps({
              "status": "ok",
              "window_local": "2026-10-05 10:15-10:35 Europe/Warsaw",
              "candidate_suffix": "***205",
              "candidate_calls": len(rows),
              "calls": rows,
          }, ensure_ascii=False, default=str, indent=2))
          PY
          then
            printf '%s\n' '{"status":"ssh_or_query_failed"}' > "$RESULT"
            rm -f "$RESULT.tmp"
            exit 0
          fi

          mv "$RESULT.tmp" "$RESULT"

      - name: Publish anonymized diagnostic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f diag-call-recordings-result.txt || printf '%s\n' '{"status":"workflow_failed_before_result"}' > diag-call-recordings-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-call-recordings-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture anonymized call recording diagnostics"
          git push
