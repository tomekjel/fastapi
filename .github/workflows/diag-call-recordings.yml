name: Diagnose call recording backend via API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-call-recordings.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query anonymized production API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > diag-call-recordings-result.txt
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BASE = "https://api.multi-servis.pl"
          TZ = ZoneInfo("Europe/Warsaw")
          start = datetime(2026,10,5,10,15,0,tzinfo=TZ)
          end   = datetime(2026,10,5,10,35,0,tzinfo=TZ)

          def get_json(path):
              req = urllib.request.Request(BASE + path, headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:
                  return 0, {"error": type(e).__name__}

          calls_status, calls = get_json("/calls?limit=500")
          rec_status, recs = get_json("/calls/recordings?limit=1000")

          result = {
              "status": "ok" if calls_status == 200 and rec_status == 200 else "api_error",
              "calls_http": calls_status,
              "recordings_http": rec_status,
              "window_local": "2026-10-05 10:15-10:35 Europe/Warsaw",
              "candidate_suffix": "***205",
              "calls": [],
              "recordings": [],
          }

          def in_window(value):
              if not value:
                  return False
              try:
                  dt = datetime.fromisoformat(value.replace("Z","+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=TZ)
                  dt = dt.astimezone(TZ)
                  return start <= dt < end, dt.strftime("%Y-%m-%d %H:%M:%S")
              except Exception:
                  return False, None

          if isinstance(calls, list):
              for c in calls:
                  digits = "".join(ch for ch in str(c.get("phone_number","")) if ch.isdigit())
                  ok, local = in_window(c.get("started_at"))
                  if digits.endswith("205") and ok:
                      result["calls"].append({
                          "local_started": local,
                          "direction": c.get("direction"),
                          "duration_seconds": c.get("duration_seconds"),
                          "recording_count": c.get("recording_count"),
                          "attached_to_reception": bool(c.get("reception_id")),
                      })

          if isinstance(recs, list):
              for r in recs:
                  digits = "".join(ch for ch in str(r.get("phone_number","")) if ch.isdigit())
                  ok, local = in_window(r.get("started_at"))
                  if digits.endswith("205") and ok:
                      result["recordings"].append({
                          "local_started": local,
                          "direction": r.get("direction"),
                          "size_bytes": r.get("size_bytes"),
                          "attached_to_reception": bool(r.get("reception_id")),
                          "has_content_url": bool(r.get("content_url")),
                      })

          result["candidate_calls"] = len(result["calls"])
          result["candidate_recordings"] = len(result["recordings"])
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Publish anonymized diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-call-recordings-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[skip ci] chore: capture anonymized call recording diagnostics"
          git push
