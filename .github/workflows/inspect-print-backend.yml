name: Inspect print backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-print-backend.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -l MultiServisServer_FINAL.zip | sed -n '1,240p'
          echo "===== MATCHING FILES ====="
          mapfile -t files < <(unzip -Z1 MultiServisServer_FINAL.zip | grep -Ei 'print|label|printer|niimbot' || true)
          printf '%s\n' "${files[@]}"
          echo "===== CONTENT SEARCH ====="
          tmp="$(mktemp -d)"
          unzip -q MultiServisServer_FINAL.zip -d "$tmp"
          grep -RniE 'print_jobs|/print/jobs|service_label_50x30|niimbot|printer' "$tmp" || true
          echo "===== MATCHED SOURCE FILE CONTENT ====="
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.py|*.sql|*.sh|*.service|*.txt|*.md|*.json|*.yaml|*.yml)
                echo "----- $f -----"
                sed -n '1,260p' "$f"
                ;;
            esac
          done < <(grep -RliE 'print_jobs|/print/jobs|service_label_50x30|niimbot|printer' "$tmp" || true)
