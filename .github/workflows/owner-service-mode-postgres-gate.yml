name: Multi-Servis SERVICE — isolated PostgreSQL release gate
on:
  push:
    branches: [feature/service-mode-monitoring-20261010]
    paths:
      - 'embedded-multiguard/app/routers/multiguard_license.py'
      - 'embedded-multiguard/tests/test_owner_panel_postgres_integration.py'
      - '.github/workflows/owner-service-mode-postgres-gate.yml'
permissions:
  contents: read
jobs:
  integration:
    name: PostgreSQL + real FastAPI OWNER service flows (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: multiservis_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d multiservis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      OWNER_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only@127.0.0.1:5432/multiservis_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test-only dependencies
        run: python -m pip install --quiet 'fastapi>=0.115,<1.0' 'SQLAlchemy>=2,<3' 'psycopg[binary]>=3,<4' 'python-multipart>=0.0.19' 'httpx>=0.27,<1' 'cryptography>=42'
      - name: Validate Python syntax
        run: python -m py_compile embedded-multiguard/app/routers/multiguard_license.py embedded-multiguard/tests/test_owner_panel_postgres_integration.py
      - name: Full actual OWNER + PostgreSQL integration test
        run: python embedded-multiguard/tests/test_owner_panel_postgres_integration.py
