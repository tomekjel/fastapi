name: Embedded Multi-Guard CI

on:
  push:
    branches: [main]
    paths:
      - "embedded-multiguard/**"
      - ".github/workflows/embedded-multiguard-ci.yml"
      - ".github/workflows/deploy-multiservis-backend.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify shell
        run: bash -n embedded-multiguard/install.sh

      - name: Verify Python syntax
        run: |
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_license.py
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_runtime.py
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_remote.py
          python3 -m py_compile embedded-multiguard/app/routers/multiguard_meshcentral.py

      - name: Verify required API routes exist in source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '@router.post("/multiguard/licenses/receptions/{reception_id}/release-channel")' embedded-multiguard/app/routers/multiguard_license.py
          grep -Fq '@router.get("/overview")' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.get("/notifications")' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.get("/support-requests")' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.post("/agent/heartbeat")' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.post("/agent/event")' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.get("/events/{event_id}")' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.get("/devices")' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.get("/telemetry")' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.get("/panel/dashboard"' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.get("/panel/licenses"' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.get("/panel/telemetry"' embedded-multiguard/app/routers/multiguard_runtime.py
          grep -Fq '@router.post("/remote-sessions")' embedded-multiguard/app/routers/multiguard_remote.py
          grep -Fq '@router.post("/agent/remote/poll")' embedded-multiguard/app/routers/multiguard_remote.py
          grep -Fq '@router.post("/agent/remote/decision")' embedded-multiguard/app/routers/multiguard_remote.py
          grep -Fq '@router.post("/agent/remote/end")' embedded-multiguard/app/routers/multiguard_remote.py
          grep -Fq 'CLIENT_LOG_BUNDLE' embedded-multiguard/app/routers/multiguard_runtime.py

      - name: Verify integration patch shape
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/msbackend
          mkdir -p /tmp/msbackend
          unzip -q MultiServisServer_FINAL.zip -d /tmp/msbackend
          cp embedded-multiguard/app/routers/multiguard_license.py /tmp/msbackend/MultiServisServer_FINAL/app/routers/multiguard_license.py
          cp embedded-multiguard/app/routers/multiguard_runtime.py /tmp/msbackend/MultiServisServer_FINAL/app/routers/multiguard_runtime.py
          cp embedded-multiguard/app/routers/multiguard_remote.py /tmp/msbackend/MultiServisServer_FINAL/app/routers/multiguard_remote.py
          cp embedded-multiguard/app/routers/multiguard_meshcentral.py /tmp/msbackend/MultiServisServer_FINAL/app/routers/multiguard_meshcentral.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/msbackend/MultiServisServer_FINAL/app/main.py')
          s=p.read_text()
          for import_line in (
              'from app.routers import multiguard_license',
              'from app.routers import multiguard_runtime',
              'from app.routers import multiguard_remote',
          ):
              if import_line not in s:
                  lines=s.splitlines()
                  at=0
                  for i,line in enumerate(lines):
                      if line.startswith('from app.routers import ') or line.startswith('import app.routers'):
                          at=i+1
                  lines.insert(at,import_line)
                  s='\n'.join(lines)+'\n'
          for include_line in (
              'app.include_router(multiguard_license.router)',
              'app.include_router(multiguard_runtime.router)',
              'app.include_router(multiguard_remote.router)',
          ):
              if include_line not in s:
                  marker='@app.get("/")'
                  assert marker in s
                  s=s.replace(marker,include_line+'\n\n'+marker,1)
          p.write_text(s)
          PY
          python3 -m py_compile \
            /tmp/msbackend/MultiServisServer_FINAL/app/main.py \
            /tmp/msbackend/MultiServisServer_FINAL/app/routers/multiguard_license.py \
            /tmp/msbackend/MultiServisServer_FINAL/app/routers/multiguard_runtime.py \
            /tmp/msbackend/MultiServisServer_FINAL/app/routers/multiguard_remote.py \
            /tmp/msbackend/MultiServisServer_FINAL/app/routers/multiguard_meshcentral.py
