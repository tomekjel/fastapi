name: Multi-Servis Multi-Guard owner panel preview — syntax & integration
on:
  push:
    branches: [multiservis-panel-multiguard-gold-crimson-v1]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Multi-Guard Python modules
        run: |
          python -m py_compile \
            embedded-multiguard/app/routers/multiguard_license.py \
            embedded-multiguard/app/routers/multiguard_runtime.py \
            embedded-multiguard/app/routers/multiguard_remote.py \
            embedded-multiguard/app/routers/multiguard_updates.py \
            embedded-multiguard/app/routers/multiguard_service_panel.py \
            embedded-multiguard/app/routers/multiguard_panel_settings.py \
            embedded-multiguard/app/routers/multiguard_panel_devices.py \
            embedded-multiguard/app/routers/multiguard_panel_theme.py \
            embedded-multiguard/app/routers/multiguard_panel_triage.py \
            embedded-multiguard/app/routers/multiguard_panel_diagnostics.py
      - name: Validate reversible backend installer syntax
        run: |
          bash -n embedded-multiguard/install.sh
          bash -n embedded-multiguard/deploy-owner-web-v12.sh
          grep -q 'MULTISERVIS_OWNER_WEB_REF' embedded-multiguard/deploy-owner-web-v12.sh
          grep -q 'ROLLBACK owner V12 panel files' embedded-multiguard/deploy-owner-web-v12.sh
          grep -q 'PASS: existing non-panel API endpoint bodies' embedded-multiguard/deploy-owner-web-v12.sh
          if grep -q 'sync_multiguard_releases.py' embedded-multiguard/deploy-owner-web-v12.sh; then
            echo 'BLOCKED: OWNER panel-only deployment would touch release synchronization'
            exit 1
          fi
      - name: Unit-test owner photo access boundaries and safe diagnostic licence drafts
        run: python embedded-multiguard/tests/test_owner_panel_security.py
      - name: Verify outbound-only owner V12 pull agent and bootstrap
        run: |
          python3 -m py_compile embedded-multiguard/scripts/owner_v12_pull_agent.py
          bash -n embedded-multiguard/install-owner-v12-agent.sh
          python3 embedded-multiguard/tests/test_owner_v12_pull_agent.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('embedded-multiguard/deploy/owner-v12-release.json').read_text())
          assert data['scope']=='owner-web-only'
          import re
          assert type(data['sequence']) is int and data['sequence']>=0
          assert re.fullmatch(r'[0-9a-f]{40}',data['target_sha'])
          if data['sequence']==0:
              assert data['target_sha']=='892a8c66e1e3cae662136ddf1360bf880b785ba8'
          print('PASS: manifest scope, immutable SHA and initial safe baseline validated')
          script=Path('embedded-multiguard/install-owner-v12-agent.sh').read_text()
          assert 'multiservis-owner-v12-pull.timer' in script
          assert 'OnUnitActiveSec=5min' in script
          assert 'NoNewPrivileges=yes' in script
          print('PASS: inert pinned baseline; pull-only, no inbound port or credentials')
          PY
      - name: Verify HTML routes and safe owner controls
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("embedded-multiguard")
          source=(root/"app/routers/multiguard_service_panel.py").read_text()
          install=(root/"install.sh").read_text()
          theme=(root/"app/routers/multiguard_license.py").read_text()
          for fragment in ['Depends(_panel_auth)', '/multiguard/panel/service', 'service.v_service_order_summary','owner_finances','media_kind']:
              assert fragment in source, fragment
          css=(root/"app/routers/multiguard_panel_theme.py").read_text()
          assert "PANEL_CSS" in theme
          assert 'multiguard_panel_theme import PANEL_CSS' in theme
          assert 'THEME_FILE' in install
          assert 'multiguard_panel_theme.py' in install
          assert '<div class="workspace-shell">' in theme
          assert 'class="workspace-sidebar"' in theme
          assert 'class="workspace-topbar"' in theme
          assert '.dashboard-hero' in css
          assert '.service-hero' in css
          assert '.telemetry-hero' in css
          assert '.device-hero' in css
          assert '.license-hero' in css
          assert '.release-timeline' in css
          assert 'font-weight:700' not in css and 'font-weight:800' not in css
          assert '--gold:' in css and '--crimson:' in css
          assert 'font: 400 16px' in css
          assert 'Przegląd wystawionych licencji' in theme or 'PANEL_CSS' in theme
          for fragment in ['SERVICE_PANEL_FILE','multiguard_service_panel.router','multiguard_panel.py','/multiguard/panel/service']:
              if fragment=="multiguard_panel.py": continue
              assert fragment in install, fragment
          assert 'curl -fsSL "$RAW_BASE/app/routers/multiguard_service_panel.py"' in install
          for fragment in [
            '@router.get("/multiguard/panel/service/{order_id}/media/{media_id}")',
            'AND m.service_order_id=:order_id',
            'AND m.deleted_at IS NULL AND o.deleted_at IS NULL',
            'settings.media_root',
            'Content-Security-Policy',
            'X-Content-Type-Options',
            'private, no-store',
            'content_disposition_type="inline" if can_inline else "attachment"',
            'class="media-thumb"',
          ]:
            assert fragment in source,fragment
          print("OWNER PHOTO SECURITY SOURCE AUDIT PASS")
          runtime=(root/"app/routers/multiguard_runtime.py").read_text()
          config=(root/"app/routers/multiguard_panel_settings.py").read_text()
          diag=(root/"app/routers/multiguard_panel_diagnostics.py").read_text()
          for fragment in [
              'guard.owner_diagnostic_plans',
              'guard.owner_diagnostic_plans_audit',
              "status='PREPARED'",
              'planned_duration_days',
          ]:
              assert fragment in diag, fragment
          assert 'multiguard_panel_diagnostics.router' in install
          assert 'DIAGNOSTICS_PANEL_FILE' in install
          assert 'owner_diagnostic_plan_panel' in runtime
          assert '/multiguard/panel/device/{installation_id}/diagnostic-plan' in install
          assert 'KeyGate' in diag and 'never signs client entitlements' in diag
          assert 'multiguard_panel_triage.router' in install
          assert 'TRIAGE_FILE' in install
          triage=(root/"app/routers/multiguard_panel_triage.py").read_text()
          for fragment in [
              'guard.owner_event_triage', 'guard.owner_event_triage_audit',
              'Depends(_panel_auth)', '_token_valid(csrf_token)',
              'FALSE_ALARM', 'RESOLVED',
              '@router.get("/multiguard/panel/incident/{event_id}"',
              '@router.post("/multiguard/panel/incident/{event_id}")',
          ]:
              assert fragment in triage, fragment
          assert 'OCENA / NOTATKA' in runtime
          assert '/multiguard/panel/incident/{event_id}' in install
          assert 'multiguard_panel_devices.router' in install
          assert 'OWNER_DEVICE_FILE' in install
          notes=(root/"app/routers/multiguard_panel_devices.py").read_text()
          assert '@router.post("/multiguard/panel/device/{installation_id}/note")' in notes
          assert 'guard.owner_device_notes_audit' in notes
          assert '_token_valid(csrf_token)' in notes
          assert 'owner_device_note_form' in runtime
          assert "owner_notes.priority" in runtime
          assert 'multiguard_panel_settings.router' in install
          assert 'SETTINGS_PANEL_FILE' in install
          assert '@router.post("/multiguard/panel/settings")' in config
          assert '@router.get("/multiguard/panel/settings"' in config
          assert 'Depends(_panel_auth)' in config
          assert '_token_valid(csrf_token)' in config
          assert 'guard.owner_panel_settings_audit' in config
          assert 'owner_panel_config' in runtime
          assert 'device_search_form' in runtime
          assert 'device_paging' in runtime
          assert ':search_like' in runtime and ':silence_days' in runtime
          assert '>Ustawienia</a>' in theme
          assert '/multiguard/panel/settings' in install
          for fragment in [
              'service_order_count',
              'service.service_orders so',
              'so.device_id=:service_device_id',
              '/multiguard/panel/service/',
              'id="service-history"',
              'repair_visits',
              'HISTORIA I ALERTY',
              'internal_installation_id',
          ]:
              assert fragment in runtime, fragment
          for fragment in [
              '@router.get("/multiguard/panel/versions"',
              "WHERE channel IN ('PILOT','STABLE')",
              'guard.release_versions',
              '_changelog',
          ]:
              assert fragment in source, fragment
          assert "Historia wersji" in theme
          # Exercise the release-note formatter without importing the production
          # backend. User-authored release notes must be escaped.
          import ast, html
          parsed=ast.parse(source)
          formatter=next(x for x in parsed.body if isinstance(x,ast.FunctionDef) and x.name=='_changelog')
          safe_globals={'esc': lambda v: html.escape(str(v),quote=True),
                        '_RELEASE_CATEGORIES':{
                          'ADDED':('Dodano','mg-green'),'FIXED':('Naprawiono','mg-blue'),
                          'CHANGED':('Zmieniono','mg-gold'),'REMOVED':('Usunięto','mg-red'),
                          'SECURITY':('Bezpieczeństwo','mg-red')
                        }}
          exec(compile(ast.Module(body=[formatter],type_ignores=[]),'<changelog-test>','exec'),safe_globals)
          make=safe_globals['_changelog']
          tests=[
            ('ADDED: Sprzęt','Dodano'),
            ('REMOVED: Stara funkcja','Usunięto'),
            ('FIXED: Czujnik','Naprawiono'),
            ('ADDED: <script>','&lt;script&gt;'),
            ('','Dla tego wydania nie zapisano'),
          ]
          for inp,expected in tests:
              rendered=make(inp)
              print('changelog test',repr(inp),'->',repr(rendered))
              assert expected in rendered, f'{inp}: expected {expected!r}; got {rendered!r}'
          # Presence status is not a claim of a live user session.
          # A missing ping is not a confirmed uninstall.
          from datetime import datetime,timezone,timedelta
          from typing import Optional
          runtime_ast=ast.parse(runtime)
          func=next(x for x in runtime_ast.body if isinstance(x,ast.FunctionDef)
                    and x.name=='_presence_indicator')
          namespace={'Optional':Optional,'datetime':datetime,'timezone':timezone}
          exec(compile(ast.Module(body=[func],type_ignores=[]),'<presence-test>','exec'),namespace)
          presence=namespace['_presence_indicator']
          now=datetime.now(timezone.utc)
          assert presence(now-timedelta(hours=3),None)[0]=='recent'
          assert presence(now-timedelta(days=3),None)[0]=='delayed'
          assert presence(now-timedelta(days=12),None)[0]=='stale'
          assert presence(None,None)[0]=='unknown'
          assert presence(now-timedelta(minutes=1),now)[0]=='removed'
          assert presence(now-timedelta(hours=47),None,recent_hours=48)[0]=='recent'
          assert presence(now-timedelta(days=9),None,delayed_days=10)[0]=='delayed'
          for fragment in [
              'CREATE TABLE IF NOT EXISTS guard.agent_uninstalls',
              'if body.eventType == "CLIENT_UNINSTALLED"',
              'source") == "windows_uninstaller"',
              "ON CONFLICT(installation_id) DO UPDATE",
              "DELETE FROM guard.agent_uninstalls",
              'CASE WHEN au.installation_id IS NOT NULL THEN 1 ELSE 0 END',
              'presence-dot',
          ]:
              assert fragment in (runtime+theme), fragment
          print("OWNER PANEL ROUTES + CHANGELOG + INSTALLATION PRESENCE AUDIT PASS")
          PY
      - name: Inspect bundled server storage interfaces for owner-photo streaming
        run: |
          python embedded-multiguard/scripts/audit_backend_storage.py
      - name: Build eight real V12 panel template previews (sample data clearly labelled)
        run: |
          python embedded-multiguard/scripts/preview_owner_panel.py owner-preview
          test "$(find owner-preview -maxdepth 1 -name '*.html' | wc -l)" -eq 8
          grep -q 'workspace-sidebar' owner-preview/01-pulpit.html
          grep -q 'hub-tile' owner-preview/01-pulpit.html
          grep -q 'id="devices"' owner-preview/08-komputery.html
          grep -q 'Dane przykładowe' owner-preview/01-pulpit.html
      - name: Render V12 screenshots in Chromium
        run: |
          python -m pip install --quiet 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          folder=Path("owner-preview").resolve()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width, height, suffix in [(1440,900,"desktop"),(390,844,"mobile")]:
                  page=browser.new_page(viewport={"width":width,"height":height},device_scale_factor=1)
                  for source in sorted(folder.glob("*.html")):
                      page.goto(source.as_uri(),wait_until="load")
                      assert page.locator(".workspace-shell").count()==1
                      assert page.locator("main#content").count()==1
                      assert page.locator("body").evaluate("(el)=>getComputedStyle(el).fontWeight")=="400"
                      assert page.locator("h1").count()>=1
                      page.screenshot(path=str(source.with_name(f"{source.stem}-{suffix}.png")),full_page=True)
                  page.close()
              # Gallery behaviour in a REAL browser: click, 4 images,
              # next/previous, zoom, keyboard and close. Synthetic image only.
              import ast
              panel_source=Path("embedded-multiguard/app/routers/multiguard_service_panel.py").read_text()
              module=ast.parse(panel_source)
              widget_expr=next(node.value for node in module.body if isinstance(node,ast.Assign)
                  and any(isinstance(t,ast.Name) and t.id=="GALLERY_WIDGET_HTML" for t in node.targets))
              widget=ast.literal_eval(widget_expr)
              from html import escape
              tiny="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
              thumbs="".join(
                f'<a class="gallery-open gallery-thumb-link" href="{tiny}" data-gallery-index="{i}" data-gallery-title="Zdjęcie {i+1}">Zdjęcie {i+1}</a>'
                for i in range(4)
              )
              gallery=browser.new_page(viewport={"width":1100,"height":820})
              gallery.set_content('<html lang="pl"><body>'+thumbs+widget+'</body></html>')
              gallery.locator(".gallery-thumb-link").first.click()
              assert gallery.locator(".photo-viewer").evaluate("(el)=>el.open")
              assert gallery.locator(".viewer-count").inner_text()=="1 / 4"
              gallery.locator(".viewer-next").click()
              assert gallery.locator(".viewer-count").inner_text()=="2 / 4"
              gallery.keyboard.press("ArrowLeft")
              assert gallery.locator(".viewer-count").inner_text()=="1 / 4"
              gallery.locator(".viewer-prev").click()
              assert gallery.locator(".viewer-count").inner_text()=="4 / 4"
              gallery.locator(".viewer-zoom-in").click()
              assert gallery.locator(".viewer-zoom-label").inner_text()=="125%"
              gallery.locator(".viewer-zoom-reset").click()
              assert gallery.locator(".viewer-zoom-label").inner_text()=="100%"
              gallery.keyboard.press("Escape")
              assert not gallery.locator(".photo-viewer").evaluate("(el)=>el.open")
              gallery.close()
              print("PASS: 4-photo gallery: next, previous, wrap, zoom/reset, Escape")

              # Sidebar routing must NEVER highlight Dashboard and Computers
              # together when Computer inventory or a physical device is shown.
              computers_html=(folder/"01-pulpit.html").read_text()
              menu=browser.new_page()
              menu.route("https://panel.multi-servis.test/**",
                  lambda route: route.fulfill(status=200, content_type="text/html",body=computers_html))
              menu.goto("https://panel.multi-servis.test/multiguard/panel/computers")
              nav=menu.locator('.workspace-sidebar nav a[aria-current="page"]')
              assert nav.count()==1, "Duplicate selected navigation items"
              assert nav.first.inner_text().strip().endswith("Komputery")
              menu.goto("https://panel.multi-servis.test/multiguard/panel/dashboard")
              nav=menu.locator('.workspace-sidebar nav a[aria-current="page"]')
              assert nav.count()==1 and nav.first.inner_text().strip().endswith("Pulpit")
              menu.goto("https://panel.multi-servis.test/multiguard/panel/device/1234")
              nav=menu.locator('.workspace-sidebar nav a[aria-current="page"]')
              assert nav.count()==1 and nav.first.inner_text().strip().endswith("Komputery")
              menu.close()
              print("PASS: dashboard, computers and device show exactly one selected sidebar item")
              browser.close()
          PY
      - name: Upload browser-rendered owner panel previews
        uses: actions/upload-artifact@v4
        with:
          name: multi-servis-v12-owner-panel-preview
          path: owner-preview/
          retention-days: 7


  integration-postgres:
    name: Isolated PostgreSQL owner-panel integration (synthetic data)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: multiservis_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d multiservis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      OWNER_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only@127.0.0.1:5432/multiservis_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test-only web stack (no real API)
        run: python -m pip install --quiet 'fastapi>=0.115,<1.0' 'SQLAlchemy>=2,<3' 'psycopg[binary]>=3,<4' 'python-multipart>=0.0.19' 'httpx>=0.27,<1' 'cryptography>=42'
      - name: Run FastAPI + PostgreSQL owner-panel functional contract tests
        run: python embedded-multiguard/tests/test_owner_panel_postgres_integration.py
