name: Inspect live Multi-Guard routes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-multiguard-routes.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://api.multi-servis.pl/openapi.json -o /tmp/openapi.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/openapi.json'))
          paths=data.get('paths',{})
          wanted=[
            '/multiguard/licenses/receptions/{reception_id}',
            '/multiguard/licenses/receptions/{reception_id}/generate',
            '/multiguard/licenses/receptions/{reception_id}/release-channel',
            '/multiguard/overview',
            '/multiguard/notifications',
            '/multiguard/support-requests',
            '/multiguard/agent/heartbeat',
            '/multiguard/agent/event',
          ]
          for p in wanted:
              print(('YES ' if p in paths else 'NO  ') + p)
          PY
