name: MASTER 1.5 owner Mesh group policy checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/staging/master15_owner_mesh_group_policy.py'
      - 'scripts/staging/test_master15_owner_mesh_group_policy.py'
      - 'scripts/staging/master15_owner_mesh_sync_engine.py'
      - 'scripts/staging/master15_owner_mesh_retry_router.py'
      - 'scripts/staging/master15_owner_mesh_v44_deploy.sh'
      - 'scripts/staging/master15_asus_mesh_service_reconcile.sh'
      - 'scripts/staging/master15_activate_owner_broker_routes.sh'
      - 'scripts/staging/master15_deploy_standard_group.sh'
      - 'scripts/staging/master15_owner_profile_bridge.py'
      - 'scripts/staging/master15_beta21_asus_only_updater.py'
      - 'scripts/staging/master15_beta21_resume_paused_asus_only.py'
      - 'scripts/staging/master15_owner_profile_target_mode_constraint_fix.py'
      - 'scripts/staging/master15_owner_grant_expired_reservation_fix.py'
      - 'scripts/staging/master15_asus_standard_one_batch_repair.py'
      - 'scripts/staging/master15_mesh_standard_allowlist_deploy.py'
      - 'scripts/staging/master15_owner_mesh_wait_timeout_deploy.sh'
      - '.github/workflows/master15-owner-mesh-policy.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/staging -p 'test_master15_owner_mesh_group_policy.py' -v
      - run: python3 -m py_compile scripts/staging/master15_owner_mesh_group_policy.py scripts/staging/master15_owner_mesh_sync_engine.py scripts/staging/master15_owner_mesh_retry_router.py scripts/staging/master15_owner_profile_bridge.py
      - run: python3 -m py_compile scripts/staging/master15_beta21_asus_only_updater.py scripts/staging/master15_beta21_resume_paused_asus_only.py scripts/staging/master15_owner_profile_target_mode_constraint_fix.py scripts/staging/master15_owner_grant_expired_reservation_fix.py scripts/staging/master15_asus_standard_one_batch_repair.py scripts/staging/master15_mesh_standard_allowlist_deploy.py
      - run: bash -n scripts/staging/master15_owner_mesh_v44_deploy.sh scripts/staging/master15_asus_mesh_service_reconcile.sh scripts/staging/master15_activate_owner_broker_routes.sh scripts/staging/master15_deploy_standard_group.sh scripts/staging/master15_owner_mesh_wait_timeout_deploy.sh
