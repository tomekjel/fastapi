name: Multi-Guard independent paid and service mode policy

on:
  push:
    branches: [feature/mg-independent-license-modes-20261030]
    paths:
      - 'embedded-multiguard/app/routers/multiguard_entitlement_modes.py'
      - 'embedded-multiguard/app/routers/multiguard_license.py'
      - 'embedded-multiguard/app/routers/multiguard_remote.py'
      - 'embedded-multiguard/app/routers/multiguard_workshop_remote.py'
      - 'embedded-multiguard/tests/test_entitlement_modes.py'
      - 'embedded-multiguard/tests/test_unattended_standing_gate.py'
      - 'embedded-multiguard/tests/test_paid_refresh_owner_mode_serialization.py'
      - 'embedded-multiguard/tests/test_client_mode_discovery_revocation.py'
      - 'embedded-multiguard/scripts/stage_paid_renewals_v44.py'
      - 'embedded-multiguard/scripts/stage_grid_v44_controls_20261030.py'
      - 'embedded-multiguard/scripts/compact_v44_grid_renderer.py'
      - 'embedded-multiguard/scripts/compact_v44_owner_term.py'
      - 'embedded-multiguard/scripts/deploy_compact_v44_one_save.py'
      - 'embedded-multiguard/scripts/deploy_v44_compact_popup_only.py'
      - 'embedded-multiguard/tests/test_v44_compact_one_save.py'
      - 'embedded-multiguard/tests/test_v44_owner_mode_and_term_contract.py'
      - 'embedded-multiguard/tests/test_owner_service_transition_end_to_end_contract.py'
      - 'embedded-multiguard/tests/test_owner_remote_paths_cross_mode_contract.py'
      - 'embedded-multiguard/tests/test_grid_v44_controls_20261030.py'
      - 'embedded-multiguard/tests/test_owner_paid_renewals_v44.py'
      - 'embedded-multiguard/scripts/stage_owner_mode_consent_invalidation_v44.py'
      - 'embedded-multiguard/tests/test_owner_mode_consent_invalidation_v44.py'
      - 'embedded-multiguard/scripts/stage_workshop_standing_gate_v44.py'
      - 'embedded-multiguard/tests/test_workshop_standing_overlay_v44.py'
      - 'embedded-multiguard/scripts/stage_owner_license_modes_v44.py'
      - 'embedded-multiguard/tests/test_owner_v44_overlay.py'
      - 'embedded-multiguard/scripts/stage_owner_grid_save_v44_surgical.py'
      - 'embedded-multiguard/tests/test_owner_grid_save_v44_surgical.py'
      - 'embedded-multiguard/scripts/stage_owner_grid_save_v44.py'
      - 'embedded-multiguard/tests/test_owner_save_overlay_v44.py'
      - 'embedded-multiguard/scripts/stage_paid_remote_mode_gate_v44.py'
      - 'embedded-multiguard/tests/test_paid_remote_v44_overlay.py'
      - '.github/workflows/mg-independent-license-modes-tests.yml'

permissions:
  contents: read

jobs:
  policy:
    name: Pure entitlement tests (no server or KeyGate)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile pure policy and test modules
        run: |
          python -m py_compile embedded-multiguard/app/routers/multiguard_entitlement_modes.py
          python -m py_compile embedded-multiguard/app/routers/multiguard_license.py
          python -m py_compile embedded-multiguard/app/routers/multiguard_remote.py
          python -m py_compile embedded-multiguard/app/routers/multiguard_workshop_remote.py
          python -m py_compile embedded-multiguard/tests/test_entitlement_modes.py
          python -m py_compile embedded-multiguard/tests/test_unattended_standing_gate.py
          python -m py_compile embedded-multiguard/tests/test_paid_refresh_owner_mode_serialization.py
          python -m py_compile embedded-multiguard/tests/test_client_mode_discovery_revocation.py
          python -m py_compile embedded-multiguard/scripts/stage_paid_renewals_v44.py
          python -m py_compile embedded-multiguard/scripts/stage_grid_v44_controls_20261030.py
          python -m py_compile embedded-multiguard/scripts/compact_v44_grid_renderer.py
          python -m py_compile embedded-multiguard/scripts/compact_v44_owner_term.py
          python -m py_compile embedded-multiguard/scripts/deploy_compact_v44_one_save.py
          python -m py_compile embedded-multiguard/scripts/deploy_v44_compact_popup_only.py
          python -m py_compile embedded-multiguard/tests/test_v44_compact_one_save.py
          python -m py_compile embedded-multiguard/tests/test_v44_owner_mode_and_term_contract.py
          python -m py_compile embedded-multiguard/tests/test_owner_service_transition_end_to_end_contract.py
          python -m py_compile embedded-multiguard/tests/test_owner_remote_paths_cross_mode_contract.py
          python -m py_compile embedded-multiguard/tests/test_grid_v44_controls_20261030.py
          python -m py_compile embedded-multiguard/tests/test_owner_paid_renewals_v44.py
          python -m py_compile embedded-multiguard/scripts/stage_owner_mode_consent_invalidation_v44.py
          python -m py_compile embedded-multiguard/tests/test_owner_mode_consent_invalidation_v44.py
          python -m py_compile embedded-multiguard/scripts/stage_workshop_standing_gate_v44.py
          python -m py_compile embedded-multiguard/tests/test_workshop_standing_overlay_v44.py
          python -m py_compile embedded-multiguard/scripts/stage_owner_license_modes_v44.py
          python -m py_compile embedded-multiguard/tests/test_owner_v44_overlay.py
          python -m py_compile embedded-multiguard/scripts/stage_owner_grid_save_v44_surgical.py
          python -m py_compile embedded-multiguard/tests/test_owner_grid_save_v44_surgical.py
          python -m py_compile embedded-multiguard/scripts/stage_owner_grid_save_v44.py
          python -m py_compile embedded-multiguard/tests/test_owner_save_overlay_v44.py
          python -m py_compile embedded-multiguard/scripts/stage_paid_remote_mode_gate_v44.py
          python -m py_compile embedded-multiguard/tests/test_paid_remote_v44_overlay.py
      - name: OWNER entitlement regression tests
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_entitlement_modes.py' -v
      - name: Workshop unattended requires OWNER and local consent
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_unattended_standing_gate.py' -v
      - name: OWNER selected mode synchronized with paid refresh and acceptance
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_paid_refresh_owner_mode_serialization.py' -v
      - name: CLIENT discovery never resurrects retained service grant
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_client_mode_discovery_revocation.py' -v
      - name: Paid renewal live OWNER route staging
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_owner_paid_renewals_v44.py' -v
      - name: V4.4 real table edition dropdown and calendar controls
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_grid_v44_controls_20261030.py' -v
      - name: Restore one-row compact expiry, calendar, no payment prompts
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_v44_compact_one_save.py' -v
      - name: Validate OWNER paid term and Service entitlement contract
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_v44_owner_mode_and_term_contract.py' -v
      - name: Validate independent OWNER Pro Service transitions without data mutation
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_owner_service_transition_end_to_end_contract.py' -v
      - name: Verify no remote consent crossover between Pro and Service
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_owner_remote_paths_cross_mode_contract.py' -v
      - name: OWNER mode standing-consent invalidation V4.4 safety
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_owner_mode_consent_invalidation_v44.py' -v
      - name: Production workshop standing security overlay compatibility
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_workshop_standing_overlay_v44.py' -v
      - name: Production V4.4 source-overlay compatibility tests
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_owner_v44_overlay.py' -v
      - name: Pinned production V4.4 surgical Save compatibility
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_owner_grid_save_v44_surgical.py' -v
      - name: Production OWNER Save V4.4 function-only compatibility
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_owner_save_overlay_v44.py' -v
      - name: Paid Pro remote mode gate, no Mesh and no KeyGate
        run: python -m unittest discover -s embedded-multiguard/tests -p 'test_paid_remote_v44_overlay.py' -v
